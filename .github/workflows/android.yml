name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Run core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        id: build
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 200 build.log
          exit $code

      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Build failure'
            echo
            echo '### Compiler / task errors'
            echo '```'
            grep -E -A4 '^e:|error:|FAILED|Unresolved reference|Type mismatch|Cannot access|None of the following' build.log | head -n 220 || true
            echo '```'
            echo
            echo '### Log tail'
            echo '```'
            tail -n 60 build.log
            echo '```'
          } > failure.md
          jq -Rs '{body: .}' failure.md \
            | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input -

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EzADB-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
